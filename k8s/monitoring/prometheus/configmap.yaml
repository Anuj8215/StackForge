apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: stackforge
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    scrape_configs:

      # Scrape backend pods /metrics endpoint
      - job_name: stackforge-backend
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [stackforge]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app]
            action: keep
            regex: backend
          - source_labels: [__address__]
            action: replace
            regex: ([^:]+)(?::\d+)?
            replacement: $1:5000
            target_label: __address__
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
        metrics_path: /metrics

      # Scrape kube-state-metrics for K8s object health
      - job_name: kube-state-metrics
        static_configs:
          - targets: [kube-state-metrics-svc.kube-system.svc.cluster.local:8080]

      # Scrape node-exporter for host CPU/memory/disk
      - job_name: node-exporter
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - source_labels: [__address__]
            action: replace
            regex: ([^:]+)(?::\d+)?
            replacement: $1:9100
            target_label: __address__
          - source_labels: [__meta_kubernetes_node_name]
            target_label: node

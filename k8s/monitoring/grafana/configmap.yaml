apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: stackforge
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        uid: prometheus
        url: http://prometheus-svc:9090
        access: proxy
        isDefault: true
        jsonData:
          timeInterval: 15s

      - name: InfluxDB
        type: influxdb
        uid: influxdb
        url: http://influxdb-svc:8086
        access: proxy
        database: k6
        jsonData:
          httpMode: GET

networks:
  stackforge-net:
    driver: bridge

volumes:
  mongo-data:
  redis-data:

services:

  # Frontend (React + Vite -> Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
    container_name: stackforge-frontend
    restart: unless-stopped
    networks:
      - stackforge-net
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:80"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Backend (Node.js + Express, port 4000)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: stackforge-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      MONGO_URI: mongodb://mongo:27017/speaksyauth
      JWT_SECRET: change_me_in_production
      JWT_EXPIRATION: 7d
      TOTP_ISSUER: SpeaksyAuth
      TOTP_DIGITS: 6
      TOTP_STEP: 30
      REDIS_HOST: redis
      REDIS_PORT: 6379
    networks:
      - stackforge-net
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:4000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: stackforge-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - stackforge-net
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    restart: unless-stopped

  # MongoDB
  mongo:
    image: mongo:7-jammy
    container_name: stackforge-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: speaksyauth
    volumes:
      - mongo-data:/data/db
    networks:
      - stackforge-net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # Redis 7
  redis:
    image: redis:7-alpine
    container_name: stackforge-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    networks:
      - stackforge-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5